name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORTIUS_INMUEBLES_SITE_URL: http://localhost:3001
      FORTIUS_INMUEBLES_TEST_URL: http://localhost:3001
      FORTIUS_INMUEBLES_PUBLIC_LEADS_ENABLED: "false"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3999
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Verify PDF deployment assets
        run: node tools/verify-pdf-bundle.mjs
      - name: Public motion, responsive layout and accessibility
        run: npm run test:public:browser
      - name: Production browser tests with backend unavailable
        run: npm run test:admin:browser -- tests/admin/browser/fortius-inmuebles-production.spec.ts tests/admin/browser/panel.spec.ts tests/admin/browser/expediente-deletion.spec.ts tests/admin/browser/admin-workspace.spec.ts
      - name: Public form browser tests with leads enabled
        env:
          FORTIUS_INMUEBLES_PUBLIC_LEADS_ENABLED: "true"
        run: npm run test:admin:browser -- tests/admin/browser/public-form-boundary.spec.ts
