name: Financial source maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: "20 14 * * 1"
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-financial-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-source-review
          path: financial-source-report.json
