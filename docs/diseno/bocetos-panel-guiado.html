<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Panel Fortius guiado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: un marco de presentación neutro (controles + notas) alrededor de una maqueta del panel a tamaño real:
   celular 390 px o computadora 1440 × 900 escalada al ancho disponible. La maqueta usa la identidad Fortius. */
:root{
  --navy:#061F3F; --wine:#8A1634;
  --bg:#FBFCFE; --surface:#FFFFFF; --sunken:#F1F4F8; --stage:#E8EDF3; --bezel:#0B1A2E;
  --ink:#061F3F; --ink-2:#4F5E73; --ink-3:#5C687A;
  --line:rgba(6,31,63,.11); --line-2:rgba(6,31,63,.24);
  --accent:#8A1634; --on-accent:#FFFFFF; --accent-ink:#8A1634; --accent-soft:#F6E8EC;
  --ok:#1D6A43; --ok-bg:#E4F1E9; --info:#1C4C86; --info-bg:#E5EDF8; --bad:#9E2A22; --bad-bg:#FBE7E4; --warn:#7A5100; --warn-bg:#F9EFD7;
  --shadow:0 1px 2px rgba(6,31,63,.06),0 10px 28px rgba(6,31,63,.07);
  --scrim:rgba(6,31,63,.34);
  --font:"Archivo",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060C14; --surface:#0C1622; --sunken:#122032; --stage:#02060B; --bezel:#1B2A3D;
  --ink:#F2EFEA; --ink-2:#B3BDCA; --ink-3:#9AA6B6;
  --line:rgba(242,239,234,.10); --line-2:rgba(242,239,234,.24);
  --accent:#A3203F; --on-accent:#FFFFFF; --accent-ink:#F0A2B4; --accent-soft:rgba(240,162,180,.12);
  --ok:#86D5A7; --ok-bg:rgba(134,213,167,.12); --info:#97BFF3; --info-bg:rgba(151,191,243,.12); --bad:#F6A399; --bad-bg:rgba(246,163,153,.13); --warn:#EEC46E; --warn-bg:rgba(238,196,110,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.56);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060C14; --surface:#0C1622; --sunken:#122032; --stage:#02060B; --bezel:#1B2A3D;
  --ink:#F2EFEA; --ink-2:#B3BDCA; --ink-3:#9AA6B6;
  --line:rgba(242,239,234,.10); --line-2:rgba(242,239,234,.24);
  --accent:#A3203F; --on-accent:#FFFFFF; --accent-ink:#F0A2B4; --accent-soft:rgba(240,162,180,.12);
  --ok:#86D5A7; --ok-bg:rgba(134,213,167,.12); --info:#97BFF3; --info-bg:rgba(151,191,243,.12); --bad:#F6A399; --bad-bg:rgba(246,163,153,.13); --warn:#EEC46E; --warn-bg:rgba(238,196,110,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.56);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--stage);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:0}
.i{flex:none;display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Marco de presentación ---------- */
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.shell>*,.stage-grid>*{min-width:0}
.sh-top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.sh-title h1{font-size:22px;font-weight:650;font-stretch:112%;letter-spacing:-.01em}
.sh-title p{color:var(--ink-2);margin-top:2px;max-width:60ch}
.sh-ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl>span{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(6,31,63,.12);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chips button .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-right:6px}
.chips button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.chips button[aria-current="true"] .n{color:inherit;opacity:.7}
.stage-grid{display:grid;gap:28px;align-items:start}
.stage-grid.is-phone{grid-template-columns:minmax(0,390px) minmax(0,440px);justify-content:center}
.stage-grid.is-desk{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.stage-grid.is-phone{grid-template-columns:minmax(0,1fr);justify-items:center}}
.frame-phone{width:390px;max-width:100%;height:min(812px,84dvh);min-height:560px;border:10px solid var(--bezel);border-radius:38px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);position:relative}
@media (max-width:480px){.frame-phone{border-width:1px;border-color:var(--line-2);border-radius:18px;height:78dvh}}
.frame-desk-wrap{width:100%;overflow:hidden;border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);background:var(--bg);position:relative}
.frame-desk{width:1440px;height:900px;transform-origin:0 0;position:absolute;top:0;left:0}
.notes{display:grid;gap:18px;align-content:start;min-width:0}
.is-desk .notes{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 40px}
.note-block h2{font-size:16px;font-weight:650;margin-bottom:8px}
.note-block h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.note-block ul{display:grid;gap:7px}
.note-block li{padding-left:16px;position:relative;color:var(--ink-2);max-width:62ch}
.note-block li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent-ink)}
.note-block.q li::before{background:var(--ink-3)}
.note-block .quita li::before{background:transparent;border:1.5px solid var(--ink-3)}
.note-meta{font-size:13px;color:var(--ink-3)}

/* ---------- Maqueta: estructura ---------- */
.app{position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-size:14px}
.app.desk{width:1440px;height:900px;display:grid;grid-template-columns:252px minmax(0,1fr)}
.app.phone{width:100%;height:100%;display:flex;flex-direction:column}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.phone .main{flex:1}
.scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.desk .page{padding:40px 48px 56px;max-width:1180px}
.desk .page.wide{max-width:none}
.phone .page{padding:16px 16px 28px}

/* Barra lateral */
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:20px 14px 14px;gap:14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.logo{width:30px;height:30px;border-radius:6px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-stretch:120%;font-size:15px}
:root[data-theme="dark"] .logo{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.wm{font-weight:650;font-stretch:115%;font-size:16px;line-height:1.1;display:grid}
.wm small{font-weight:500;font-stretch:100%;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.search-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;height:36px;padding:0 10px;color:var(--ink-3);font-size:13px;text-align:left}
.search-btn kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.nav{display:grid;gap:2px}
.nav-item{width:100%;display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border:0;background:transparent;border-radius:8px;color:var(--ink-2);font-size:14.5px;font-weight:500;text-align:left}
.nav-item:hover{background:var(--sunken);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--sunken);color:var(--ink);font-weight:650}
.nav-item[aria-current="page"] .i{color:var(--accent-ink)}
.nav-item .badge{margin-left:auto;min-width:22px;height:20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-item .chev{margin-left:auto;transition:transform .15s}
.nav-item[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nav-sep{height:1px;background:var(--line);margin:6px 10px}
.nav-sub{display:grid;gap:1px;padding:2px 0 4px 31px}
.nav-sub button{border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:6px;color:var(--ink-2);font-size:13.5px}
.nav-sub button:hover{background:var(--sunken);color:var(--ink)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:650;flex:none}
.side-foot p{font-size:13.5px;font-weight:600;line-height:1.2}
.side-foot p.muted{font-weight:400;font-size:12px}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.side-foot .icon-btn{margin-left:auto}

/* Celular: encabezado y barra inferior */
.ptop{display:flex;align-items:center;gap:10px;height:56px;padding:0 8px 0 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.ptop .logo{width:26px;height:26px;font-size:13px}
.ptop h1{font-size:17px;font-weight:650;font-stretch:108%}
.ptop .sp{margin-left:auto;display:flex;gap:2px}
.ptop .back{display:flex;align-items:center;gap:2px;border:0;background:transparent;color:var(--accent-ink);font-weight:600;padding:8px 6px 8px 0;margin-left:-6px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid var(--line);background:var(--surface);height:64px;padding:0 4px}
.tab{border:0;background:transparent;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-3);padding:6px 0;position:relative}
.tab[aria-current="page"]{color:var(--ink);font-weight:650}
.tab[aria-current="page"] .i{color:var(--accent-ink)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:650;display:grid;place-items:center;padding:0 4px}
.tab-plus{justify-self:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 4px 12px rgba(138,22,52,.3)}

/* ---------- Piezas comunes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-primary[aria-disabled="true"]{background:var(--sunken);border-color:var(--line-2);color:var(--ink-3);filter:none;cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{height:34px;padding:0 12px;font-size:13.5px}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-danger.solid{background:var(--bad);color:var(--surface)}
.link{border:0;background:transparent;padding:0;color:var(--accent-ink);font-weight:600;font-size:13.5px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.ph{display:grid;gap:6px;margin-bottom:32px}
.phone .ph{margin-bottom:22px}
.ph h1{font-size:30px;font-weight:650;font-stretch:112%;letter-spacing:-.015em;line-height:1.15}
.phone .ph h1{font-size:24px}
.lede{color:var(--ink-2);font-size:15px}
.ph-row{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.sec{display:grid;gap:12px;align-content:start}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2,.sec-h h2{font-size:16px;font-weight:650}
.rows>li{border-top:1px solid var(--line)}
.rows>li:last-child{border-bottom:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.tag .n{font-family:var(--mono);font-weight:500}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tone-bad{color:var(--bad)} .tone-ok{color:var(--ok)} .tone-warn{color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:550;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:0;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:650}
.tabs button .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:4px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--ink-3)}
.input,.select,.textarea{width:100%;height:42px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 12px;font-size:15px}
.textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.45}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:550}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills label{position:relative}
.pills input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pills span{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;font-size:14px;background:var(--surface)}
.pills input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.pills input:focus-visible+span{outline:2px solid var(--accent-ink);outline-offset:2px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.check input{appearance:none;width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:5px;margin:1px 0 0;flex:none;display:grid;place-items:center;background:var(--surface);cursor:pointer}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:10px;height:5px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check.done .ct{text-decoration:line-through;color:var(--ink-3)}
.check .ct{font-weight:550}
.check .cs{font-size:13px;color:var(--ink-3)}
.thumb{width:72px;height:54px;border-radius:6px;flex:none;display:grid;place-items:center;color:var(--ink-3);background:var(--sunken);border:1px solid var(--line);overflow:hidden}
.phone .thumb{width:60px;height:48px}

/* Hoy */
.hoy-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:48px}
.phone .hoy-grid{grid-template-columns:1fr;gap:32px}
.hoy-col{display:grid;gap:40px;align-content:start}
.phone .hoy-col{gap:32px}
.wait{display:flex;gap:16px;align-items:center;padding:16px 0}
.phone .wait{align-items:flex-start;flex-wrap:wrap;gap:10px}
.wait .rm{flex:1;min-width:0;display:grid;gap:2px}
.rt{font-weight:650;font-size:15px}
.rs{color:var(--ink-2);font-size:13.5px}
.why{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:550;margin-top:4px}
.wait .side-r{display:flex;align-items:center;gap:12px;flex:none}
.phone .wait .side-r{width:100%;justify-content:space-between}
.agenda li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.agenda li:last-child{border-bottom:1px solid var(--line)}
.agenda time{font-family:var(--mono);font-size:13.5px;font-weight:500;padding-top:1px}
.agenda li.now time{color:var(--accent-ink)}
.report{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* Operaciones: tablero */
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:start}
.col-stage{display:grid;gap:8px;background:var(--sunken);border-radius:10px;padding:10px;min-height:420px;align-content:start}
.col-stage header{display:flex;align-items:center;gap:8px;padding:4px 4px 6px}
.col-stage h2{font-size:13.5px;font-weight:650;line-height:1.25}
.num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11.5px;font-weight:650;flex:none;font-family:var(--mono)}
.col-stage .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.opcard{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;display:grid;gap:3px}
.opcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.opcard .rt{font-size:14px}
.opcard .rs{font-size:12.5px}
.oc-next{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.oc-next.late{color:var(--accent-ink);font-weight:600}
.oc-next .i{margin-top:2px}
.empty{color:var(--ink-3);font-size:13px;padding:8px 4px}
.stage-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 16px;padding-inline:16px;scrollbar-width:none}
.stage-pills button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;height:36px;padding:0 13px;font-size:13.5px;color:var(--ink-2)}

function actionbar(){

 const label=nx?`Pasar a: ${nx.label}`:'Cerrar y archivar';
 const left=m.length?`<span class="k">Te falta:</span>${m.map((k,i)=>`<button type="button" class="link" data-act="focusreq" data-arg="${k}">${REQ[k].t}${req(op,k).st==='prob'?' (hay un problema)':''}</button>${i<m.length-1?'<span class="sep">·</span>':''}`).join('')}`:`<span class="ok">${I('check',16)} Todo listo para avanzar</span>`;
 return `<div class="actionbar"><div class="ab-miss">${left}</div><button type="button" class="btn btn-primary" data-act="advance" aria-disabled="${m.length>0}">${label} ${I('arrow',18)}</button></div>`;
}

function wizSteps(){const own=['vender','rentar_prop'].includes(S.wiz.tipo);return ['tipo','quien',...(own?OWNER_SECTIONS:BUYER_SECTIONS).map((s,i)=>'s'+i),'listo'];}
function field(f){
 if(f.two) return `<div class="two">${f.f.map(field).join('')}</div>`;
 const v=S.wiz.vals[f.id]??f.v, id='wz-'+f.id;
 const hint=f.h?`<p class="hint" id="${id}-h">${f.h}</p>`:'';
 if(f.type==='pills'||f.type==='checks'){
  const multi=f.type==='checks';
  return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:6px">${f.l}</legend><div class="pills">${f.o.map((o,i)=>`<label><input type="${multi?'checkbox':'radio'}" name="${id}" id="${id}-${i}" value="${o}" ${(multi?v.includes(o):v===o)?'checked':''}><span>${o}</span></label>`).join('')}</div>${hint}</fieldset>`;
 }
 if(f.type==='select') return `<div class="field"><label for="${id}">${f.l}</label><select class="select" id="${id}">${f.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>${hint}</div>`;
 if(f.type==='textarea') return `<div class="field"><label for="${id}">${f.l}</label><textarea class="textarea" id="${id}">${v}</textarea>${hint}</div>`;
 if(f.type==='docs') return `<ul class="docs-ask">${DOCS_ASK.map((d,i)=>`<li><label for="wz-doc-${i}" style="font-weight:600">${d[0]}</label><select class="select" id="wz-doc-${i}">${['Lo tiene','Lo va a conseguir','No aplica','No sabe'].map(o=>`<option ${o===d[1]?'selected':''}>${o}</option>`).join('')}</select></li>`).join('')}</ul><div class="field"><label for="wz-docdate">¿Cuándo entrega lo que falta?</label><input class="input" type="date" id="wz-docdate" value="2026-10-23"></div>`;
 return `<div class="field"><label for="${id}">${f.l}</label><input class="input" id="${id}" value="${v}" ${f.h?`aria-describedby="${id}-h"`:''}>${hint}</div>`;
}

function wizFoot(){

function vSheet(){
 const sh=S.sheet; if(!sh) return '';
 const op=getOp(S.opId);
 const wrap=(title,sub,body,foot,form)=>`<div class="layer"><button type="button" class="scrim" data-act="close" aria-label="Cerrar" tabindex="-1"></button><${form?`form data-form="${form}" novalidate`:'div'} class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-h"><div><h2 id="sh-t">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button type="button" class="icon-btn" data-act="close" aria-label="Cerrar">${I('x')}</button></div><div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:''}</${form?'form':'div'}></div>`;
 if(sh.type==='status'){
  const k=sh.key,cur=req(op,k).st;
  return wrap(REQ[k].t,'Elige el estado',`<div style="display:grid;gap:4px;margin:0 -10px">${Object.entries(STATES).map(([id,s])=>{const dis=id==='na'&&!REQ[k].na;return `<button type="button" class="mi t-${id}" aria-checked="${cur===id}" role="menuitemradio" data-act="setst" data-arg="${k}|${id}" ${dis?'disabled':''} style="padding:12px 10px">${I(s.i,20)}<span class="l" style="font-size:15px">${s.l}${id==='rev'?' ✓':''}</span><span class="h" style="font-size:13px">${dis?'Este requisito siempre aplica.':s.h}</span></button>`}).join('')}</div>`,'');
 }
 if(sh.type==='rev'){
  const k=sh.key,def=REQ[k];
  const docs=(op.docs||[]).map(d=>d[0]);
  return wrap('Marcar como revisado',def.t,`
   <div class="field"><label for="rv-doc">¿Qué documento lo respalda?</label><select class="select" id="rv-doc" aria-describedby="rv-doc-e"><option value="">Elige un documento</option>${docs.map(d=>`<option>${d}</option>`).join('')}<option value="ext">Un documento fuera del sistema…</option></select><p class="err" id="rv-doc-e" hidden>Elige el documento que respalda la revisión.</p></div>
   <div class="field" id="rv-ext-w" hidden><label for="rv-ext">Describe el documento y dónde está</label><input class="input" id="rv-ext" placeholder="Ej. Avalúo bancario impreso, en la carpeta física" aria-describedby="rv-ext-e"><p class="err" id="rv-ext-e" hidden>Escribe al menos 10 letras para que otro asesor lo encuentre.</p></div>
   <div class="field"><label for="rv-who">¿Quién lo revisó?</label><select class="select" id="rv-who">${TEAM.map(t=>`<option ${t===op.asesor?'selected':''}>${t}</option>`).join('')}</select></div>
   <div class="field"><label for="rv-date">Fecha de revisión</label><input class="input" type="date" id="rv-date" value="2026-10-15"></div>
   ${def.vig?`<div class="field"><label for="rv-vig">Vigente hasta</label><input class="input" type="date" id="rv-vig" aria-describedby="rv-vig-h rv-vig-e"><p class="hint" id="rv-vig-h">Este documento vence. Te avisaremos antes de que pase.</p><p class="err" id="rv-vig-e" hidden>Indica hasta cuándo es válido.</p></div>`:''}
   <details class="more"><summary>Más detalles ${I('chevd',16)}</summary><div class="inner">
    <div class="field"><label for="rv-res">Qué encontraste</label><textarea class="textarea" id="rv-res" placeholder="Ej. Los 3 comparables están en un radio de 1 km y son de este año."></textarea></div>
    <div class="field"><label for="rv-lim">Límites o salvedades</label><textarea class="textarea" id="rv-lim" placeholder="Ej. No se revisó el interior de la bodega."></textarea></div>
    <p class="hint">Formato ${def.f} · versión del documento se toma del archivo elegido.</p></div></details>`,
   `<button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn btn-primary">${I('check',18)} Guardar como revisado</button>`,'rev');
 }
 if(sh.type==='prob'||sh.type==='na'){
  const k=sh.key,p=sh.type==='prob';
  return wrap(p?'Hay un problema':'No aplica',REQ[k].t,`<div class="field"><label for="pb-txt">${p?'¿Qué no cuadra?':'¿Por qué no aplica?'}</label><textarea class="textarea" id="pb-txt" aria-describedby="pb-h pb-e" placeholder="${p?'Ej. El balcón mide 9 m², no 12 m² como dice la ficha.':'Ej. La venta es de contado y no requiere registro adicional.'}"></textarea><p class="hint" id="pb-h">${p?'La etapa no avanza hasta que se resuelva. Queda en el historial.':'Queda anotado en el historial.'}</p><p class="err" id="pb-e" hidden>Escribe una explicación corta.</p></div>`,
   `<button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button>`,sh.type);
 }
 if(sh.type==='help'){
  const st=STAGES[op.stage];
  return wrap('¿Qué significa?','',`<div class="help" style="display:grid;gap:22px"><div><h3>${st.label}</h3><p class="muted">${st.full}</p></div>
   <div><h3>Los estados de cada requisito</h3><dl>${Object.entries(STATES).map(([id,s])=>`<div><dt><span class="status s-${id}" style="height:26px;font-size:12.5px">${I(s.i,14)}${s.l}</span></dt><dd>${{pend:'Todavía no lo tienes.',tengo:'Ya lo recibiste, pero nadie lo ha revisado. Recibir no es lo mismo que revisar.',rev:'Lo revisaste y anotaste qué documento lo respalda, quién lo revisó y cuándo. Solo así cuenta para avanzar.',prob:'Algo no cuadra. La etapa no avanza hasta resolverlo.',na:'Solo en requisitos que lo permiten (registro y honorarios). Pide el motivo.'}[id]}</dd></div>`).join('')}</dl></div>
   <div><h3>¿Por qué se pide el respaldo?</h3><p class="muted">Para que cualquier persona del equipo sepa en qué se basó la revisión, y para que la operación quede bien documentada si después hay una duda o un reclamo.</p></div></div>`,'');
 }
 return '';
}

/* ---------- Ensamblado ---------- */
function screenHtml(){
 switch(S.screen){
  case 'hoy':return vHoy(); case 'operaciones':return vOps(); case 'op':return vOp(); case 'nueva':return vNueva();
  case 'contactos':return vContactos(); case 'inmuebles':return vInmuebles(); case 'agenda':return vAgenda(); case 'herramientas':return vTools();
  case 'menu':return isPhone()?vMenu():vHoy();
 }
 return vHoy();
}
function navActive(id){
 const s=S.screen==='op'?'operaciones':S.screen==='menu'&&!isPhone()?'hoy':S.screen;
 return s===id;
}
function sidebar(){
 const it=(id,l,ic,extra='')=>`<li><button type="button" class="nav-item" data-act="go" data-arg="${id}" ${navActive(id)?'aria-current="page"':''}>${I(ic,19)}${l}${extra}</button></li>`;
 const pend=TASKS.filter(t=>!t.done).length+1;
 return `<aside class="side"><div class="brand"><span class="logo" aria-hidden="true">F</span><span class="wm">Fortius<small>Inmuebles</small></span></div>
 <button type="button" class="btn btn-primary btn-block" data-act="go" data-arg="nueva">${I('plus',18)} Nueva operación</button>
 <button type="button" class="search-btn" data-act="toast" data-arg="Busca operaciones, contactos o inmuebles por nombre, folio o teléfono.">${I('search',16)} Buscar<kbd>Ctrl K</kbd></button>
 <nav aria-label="Principal" style="display:grid;gap:6px"><ul class="nav">${it('hoy','Hoy','sun',`<span class="badge" aria-label="${pend} pendientes">${pend}</span>`)}${it('operaciones','Operaciones','layers')}${it('contactos','Contactos','users')}${it('inmuebles','Inmuebles','home')}${it('agenda','Agenda','calendar')}</ul>
 <div class="nav-sep"></div><ul class="nav">${it('herramientas','Herramientas','grid','<span class="count">16</span>')}
 ${S.role==='admin'?`<li><button type="button" class="nav-item" data-act="admin" aria-expanded="${S.adminOpen}" aria-controls="adm-list">${I('sliders',19)}Administración${I('chevd',16).replace('class="i"','class="i chev"')}</button>${S.adminOpen?`<ul class="nav-sub" id="adm-list">${['Equipo','Sitio web','Reportes','Historial','Configuración'].map(l=>`<li><button type="button" data-act="adminitem" data-arg="${l}">${l}</button></li>`).join('')}</ul>`:''}</li>`:''}</ul></nav>
 <div class="side-foot"><span class="avatar">DR</span><div><p>Daniela Ríos</p><p class="muted">${S.role==='admin'?'Administradora':'Asesora'}</p></div><button type="button" class="icon-btn" data-act="theme" aria-label="Cambiar entre modo claro y oscuro">${I('moon',18)}</button></div></aside>`;
}
function phoneTop(){
 const titles={hoy:'Hoy',operaciones:'Operaciones',contactos:'Contactos',inmuebles:'Inmuebles',agenda:'Agenda',herramientas:'Herramientas',menu:'Menú'};
 if(S.screen==='op') return `<header class="ptop"><button type="button" class="back" data-act="go" data-arg="operaciones">${I('chevl',20)}Operaciones</button><span class="sp"><button type="button" class="icon-btn" data-act="optab" data-arg="ajustes" aria-label="Ajustes de la operación">${I('sliders',20)}</button></span></header>`;
 if(S.screen==='nueva') return `<header class="ptop"><h1>Nueva operación</h1><span class="sp"><button type="button" class="icon-btn" data-act="go" data-arg="hoy" aria-label="Cerrar asistente">${I('x',20)}</button></span></header>`;
 const back=['inmuebles','agenda','herramientas'].includes(S.screen);
 return `<header class="ptop">${back?`<button type="button" class="back" data-act="go" data-arg="menu">${I('chevl',20)}Menú</button>`:`<span class="logo" aria-hidden="true">F</span><h1>${titles[S.screen]||'Hoy'}</h1>`}<span class="sp"><button type="button" class="icon-btn" data-act="toast" data-arg="Busca operaciones, contactos o inmuebles." aria-label="Buscar">${I('search',20)}</button></span></header>`;
}
function tabbar(){
 const cur=S.screen==='op'?'operaciones':['inmuebles','agenda','herramientas','menu'].includes(S.screen)?'menu':S.screen;
 const t=(id,l,ic,extra='')=>`<button type="button" class="tab" data-act="go" data-arg="${id}" ${cur===id?'aria-current="page"':''}>${I(ic,22)}${l}${extra}</button>`;
 return `<nav class="tabbar" aria-label="Principal">${t('hoy','Hoy','sun',`<span class="badge">${TASKS.filter(x=>!x.done).length+1}</span>`)}${t('operaciones','Operaciones','layers')}<button type="button" class="tab-plus" data-act="go" data-arg="nueva" aria-label="Nueva operación">${I('plus',24)}</button>${t('contactos','Contactos','users')}${t('menu','Menú','menu')}</nav>`;
}
function appHtml(){
 const opGuide=S.screen==='op'&&S.opTab==='guia';
 const foot=opGuide?actionbar():S.screen==='nueva'?wizFoot():'';
 const toast=S.toast?`<div class="toast" role="status">${S.toast}</div>`:'';
 if(isPhone()) return `<div class="app phone">${phoneTop()}<div class="main"><div class="scroll" id="scroll">${screenHtml()}</div>${foot}</div>${S.screen==='nueva'?'':tabbar()}${vSheet()}${toast}</div>`;
 return `<div class="app desk">${sidebar()}<div class="main"><div class="scroll" id="scroll">${screenHtml()}</div>${foot}</div>${vSheet()}${toast}</div>`;
}

/* ---------- Render ---------- */
const frame=document.getElementById('frame'), notes=document.getElementById('notes'), stage=document.getElementById('stage');
let lastScreenKey='', toastTimer=null, focusSel=null;
function render(){
 const key=S.screen+'|'+S.opId+'|'+S.opTab+'|'+S.wiz.step+'|'+S.device;
 const prevScroll=document.getElementById('scroll')?.scrollTop||0;
 const a=document.activeElement;
 const refocus=focusSel||(a&&frame.contains(a)&&a.dataset.act?`[data-act="${a.dataset.act}"]${a.dataset.arg!==undefined?`[data-arg="${CSS.escape(a.dataset.arg)}"]`:''}`:null);
 focusSel=null;
 // controles del marco
 document.querySelectorAll('#c-device button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.arg===S.device));
 document.querySelectorAll('#c-theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.arg===S.theme));
 document.querySelectorAll('#c-role button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.arg===S.role));
 const ent=entryOf();
 document.getElementById('c-screens').innerHTML=ENTRIES.map(([id,l],i)=>`<button type="button" data-shell="screen" data-arg="${id}" aria-current="${ent===id}"><span class="n">${i+1}</span>${l}</button>`).join('');
 stage.className='stage-grid '+(isPhone()?'is-phone':'is-desk');
 const app=appHtml();
 frame.innerHTML=isPhone()?`<div class="frame-phone">${app}</div>`:`<div class="frame-desk-wrap" id="dw"><div class="frame-desk">${app}</div></div>`;
 const n=NOTES[ent]||NOTES.hoy;
 notes.innerHTML=`<section class="note-block"><h2>${n.t}</h2><h3>Qué cambia</h3><ul>${n.b.map(x=>`<li>${x}</li>`).join('')}</ul></section>
  ${n.q.length?`<section class="note-block"><h3>Lo que se quita</h3><ul class="quita">${n.q.map(x=>`<li>${x}</li>`).join('')}</ul></section>`:''}
  <section class="note-block q"><h3>Preguntas abiertas</h3><ul>${QUESTIONS.map(x=>`<li>${x}</li>`).join('')}</ul><p class="note-meta" style="margin-top:12px">Comenta cada pantalla en esta página. Los cambios se ajustan aquí mismo hasta aprobarla.</p></section>`;
 fit();
 const sc=document.getElementById('scroll');
 if(sc&&key===lastScreenKey) sc.scrollTop=prevScroll;
 lastScreenKey=key;
 if(refocus){const el=frame.querySelector(refocus);if(el)el.focus({preventScroll:true});}
 if(S.sheet){const f=frame.querySelector('.sheet select, .sheet textarea, .sheet .mi:not([disabled])');if(f&&!(refocus&&frame.querySelector(refocus)?.closest('.sheet')))f.focus({preventScroll:true});}
 if(S.flash){const el=frame.querySelector('#req-'+S.flash);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.querySelector('.status')?.focus({preventScroll:true});}S.flash=null;}
}
function fit(){
 const w=document.getElementById('dw'); if(!w) return;
 const s=Math.min(1,w.clientWidth/1440);
 w.firstElementChild.style.transform=`scale(${s})`;
 w.style.height=(900*s)+'px';
}
new ResizeObserver(fit).observe(stage);
function toast(t){
 S.toast=t; clearTimeout(toastTimer); render();
 toastTimer=setTimeout(()=>{S.toast=null;frame.querySelector('.toast')?.remove();},2800);
}
function applyTheme(){
 const r=document.documentElement;
 if(S.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme);
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
 const sb=e.target.closest('[data-shell]');
 if(sb){
  const a=sb.dataset.shell,v=sb.dataset.arg;
  if(a==='device'){S.device=v;S.menuReq=null;S.sheet=null;if(S.screen==='menu'&&v==='desktop')S.screen='hoy';if(S.sel==='nav'&&v==='phone')S.screen='menu';}
  if(a==='theme'){S.theme=v;applyTheme();}
  if(a==='role'){S.role=v;}
  if(a==='screen'){pick(v);try{history.replaceState(null,'','#'+v)}catch(_){}}
  render();return;
 }
 const el=e.target.closest('[data-act]');
 if(!el||!frame.contains(el)){
  if(S.menuReq&&!e.target.closest('.menu')){S.menuReq=null;render();}
  return;
 }
 const act=el.dataset.act, arg=el.dataset.arg;
 if(el.getAttribute('aria-disabled')==='true'&&act!=='advance') return;
 if(act==='task'||act==='optask'||act==='wtipo'){ // casillas: se procesan en change
  return;
 }
 if(act!=='status'&&act!=='setst') S.menuReq=null;
 switch(act){
  case 'go': S.sel=null;S.sheet=null;S.confirmDel=false;S.screen=arg;if(arg==='nueva')S.wiz={step:0,tipo:'vender',dup:null,vals:{}};break;
  case 'goagenda': S.sel=null;S.screen='agenda';S.atab=arg;break;
  case 'op': S.sel=null;S.screen='op';S.opId=arg;S.opTab='guia';S.confirmDel=false;break;
  case 'optab': S.opTab=arg;S.confirmDel=false;break;
  case 'scope': S.scope=arg;break;
  case 'stab': S.stageTab=+arg;break;
  case 'ctab': S.ctab=arg;break;
  case 'atab': S.atab=arg;break;
  case 'ifil': S.ifilter=arg;break;
  case 'day': S.day=+arg;break;
  case 'admin': S.adminOpen=!S.adminOpen;break;
  case 'adminitem': return toast(`${arg}: conserva sus funciones actuales y recibe el estilo nuevo en la Fase C.`);
  case 'theme': {const dark=S.theme==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);S.theme=dark?'light':'dark';applyTheme();break;}
  case 'toast': return toast(arg);
  case 'tool': return toast(`Abre «${arg}» con los datos de esta operación.`);
  case 'help': S.sheet={type:'help'};break;
  case 'close': {const k=S.sheet?.key;S.sheet=null;if(k)focusSel=`[data-act="status"][data-arg="${k}"]`;break;}
  case 'status': if(isPhone()){S.sheet={type:'status',key:arg};}else{S.menuReq=S.menuReq===arg?null:arg;if(S.menuReq)focusSel=`.menu .mi[aria-checked="true"]`;}break;
  case 'setst': {
   const [k,st]=arg.split('|'), op=getOp(S.opId); S.menuReq=null;
   if(st==='rev'||st==='prob'||st==='na'){S.sheet={type:st,key:k};break;}
   op.req[k]={st}; S.sheet=null; focusSel=`[data-act="status"][data-arg="${k}"]`;
   return toast(`«${REQ[k].t}» quedó como ${STATES[st].l}.`);
  }
  case 'focusreq': S.opTab='guia';S.flash=arg;break;
  case 'advance': {
   const op=getOp(S.opId), m=missing(op);
   if(m.length){S.flash=m[0];render();return toast(`Antes de avanzar completa: ${m.map(k=>REQ[k].t).join(', ')}.`);}
   if(op.stage>=5) return toast('La operación se cerraría y archivaría aquí.');
   op.stage++; const ns=STAGES[op.stage];
   op.next={t:'Empezar con: '+REQ[ns.reqs[0]].t.toLowerCase(),f:'Por definir'};
   op.hist=[['15 oct',`${op.asesor} pasó la operación a ${ns.label}.`],...(op.hist||[])];
   lastScreenKey='';
   return toast(`La operación pasó a ${ns.label}.`);
  }
  case 'delask': S.confirmDel=true;focusSel='[data-act="delno"]';break;
  case 'delno': S.confirmDel=false;focusSel='[data-act="delask"]';break;
  case 'delok': S.confirmDel=false;return toast('En el boceto no se elimina nada.');
  case 'wdup': S.wiz.dup=arg;break;
  case 'wback': S.wiz.step=Math.max(0,S.wiz.step-1);break;
  case 'wnext': {
   const k=wizSteps()[S.wiz.step];
   if(k==='quien'&&!S.wiz.dup){return toast('Indica si es la misma persona o una nueva.');}
   S.wiz.step++;
   break;
  }
  case 'wopen': {
   if(!getOp('dominguez')) OPS.unshift({id:'dominguez',folio:'EXP-2026-044',cliente:'Gabriela Domínguez',contacto:'Gabriela Domínguez Soto',tel:'664 218 3390',inmueble:'Casa en Lomas de Agua Caliente',precio:'$3,600,000 (deseado)',asesor:'Daniela Ríos',stage:0,desde:'Prospecto desde el 2 de octubre',
    req:{entrevista:{st:'rev',doc:'Entrevista con el propietario',by:'Daniela Ríos',date:'15 oct'}},next:{t:'Pedir el predial 2026 y el acta de matrimonio',f:'Vie 23 oct'},
    docs:[['Entrevista con el propietario','PDF generado · 15 oct','Entrevista con el propietario']],hist:[['15 oct','Daniela Ríos creó la operación y completó la entrevista.']],tasks:[['Pedir el predial 2026','Vie 23 oct',false],['Pedir el acta de matrimonio','Vie 23 oct',false]]});
   S.screen='op';S.opId='dominguez';S.opTab='guia';S.sel=null;break;
  }
 }
 render();
});
frame.addEventListener('change',e=>{
 const t=e.target, act=t.dataset.act;
 if(act==='task'){
  const task=TASKS.find(x=>x.id===t.dataset.arg); if(task){task.done=t.checked;} t.closest('.check')?.classList.toggle('done',t.checked);
  if(!task) return;
  focusSel=`[data-act="task"][data-arg="${task.id}"]`; return toast(t.checked?'Tarea terminada.':'Tarea pendiente otra vez.');
 }
 if(act==='optask'){const op=getOp(S.opId);if(op.tasks){op.tasks[+t.dataset.arg][2]=t.checked;}t.closest('.check')?.classList.toggle('done',t.checked);return;}
 if(act==='wtipo'){S.wiz.tipo=t.value;return;}
 if(t.id==='rv-doc'){const w=frame.querySelector('#rv-ext-w');if(w)w.hidden=t.value!=='ext';frame.querySelector('#rv-doc-e').hidden=true;t.removeAttribute('aria-invalid');}
 if(t.id&&t.id.startsWith('wz-')&&t.type!=='radio'&&t.type!=='checkbox'){S.wiz.vals[t.id.slice(3)]=t.value;}
 if(t.name&&t.name.startsWith('wz-')&&t.type==='radio'){S.wiz.vals[t.name.slice(3)]=t.value;}
 if(t.name&&t.name.startsWith('wz-')&&t.type==='checkbox'){S.wiz.vals[t.name.slice(3)]=[...frame.querySelectorAll(`input[name="${t.name}"]:checked`)].map(x=>x.value);}
});
frame.addEventListener('submit',e=>{
 e.preventDefault();
 const f=e.target, kind=f.dataset.form, k=S.sheet?.key, op=getOp(S.opId);
 const bad=(id,eid)=>{const el=f.querySelector('#'+id);el.setAttribute('aria-invalid','true');f.querySelector('#'+eid).hidden=false;el.focus();};
 if(kind==='rev'){
  const doc=f.querySelector('#rv-doc').value;
  if(!doc) return bad('rv-doc','rv-doc-e');
  let docName=doc;
  if(doc==='ext'){const x=f.querySelector('#rv-ext').value.trim();if(x.length<10) return bad('rv-ext','rv-ext-e');docName=x;}
  const vigEl=f.querySelector('#rv-vig');
  if(vigEl&&!vigEl.value) return bad('rv-vig','rv-vig-e');
  const fmt=d=>{const [y,m,dd]=d.split('-');return `${+dd} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m-1]}${y!=='2026'?' '+y:''}`};
  op.req[k]={st:'rev',doc:docName,by:f.querySelector('#rv-who').value,date:fmt(f.querySelector('#rv-date').value||'2026-10-15'),vig:vigEl?fmt(vigEl.value)+(vigEl.value.startsWith('2026')?' 2026':''):undefined};
  op.hist=[['15 oct',`${f.querySelector('#rv-who').value} marcó «${REQ[k].t}» como revisado.`],...(op.hist||[])];
 } else {
  const txt=f.querySelector('#pb-txt').value.trim();
  if(txt.length<3) return bad('pb-txt','pb-e');
  op.req[k]=kind==='prob'?{st:'prob',pb:txt}:{st:'na',why:txt};
 }
 S.sheet=null; focusSel=`[data-act="status"][data-arg="${k}"]`;
 toast(kind==='rev'?`«${REQ[k].t}» quedó revisado.`:kind==='prob'?'Problema anotado. La etapa no avanza hasta resolverlo.':'Anotado como «No aplica».');
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&(S.sheet||S.menuReq)){const k=S.sheet?.key||S.menuReq;S.sheet=null;S.menuReq=null;if(k)focusSel=`[data-act="status"][data-arg="${k}"]`;render();}
});

/* ---------- Inicio ---------- */
const h=(location.hash||'').slice(1);
if(ENTRIES.some(([id])=>id===h)) pick(h);
render();
})();
</script>

</body></html>
