<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inmuebles en celular</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fortius-panel.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fp" style="width: 390px; min-height: 1500px; display: flex; flex-direction: column">
  <main style="flex: 1; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 class="h1" style="font-size: 27px">Inmuebles</h1>
        <p class="small mut">18 inmuebles · 12 publicados</p>
      </div>
      <button class="icon-btn" type="button" aria-label="Buscar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    </header>
    <div class="seg" role="radiogroup" aria-label="Operación" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%">
      <button type="button" role="radio" aria-checked="true" class="on">Todos</button>
      <button type="button" role="radio" aria-checked="false">En venta</button>
      <button type="button" role="radio" aria-checked="false">En renta</button>
    </div>
    <sc-for list="{{inmuebles}}" as="i" hint-placeholder-count="4">
      <a class="card" href="#" style="display: flex; flex-direction: column; overflow: hidden; text-decoration: none">
        <span class="ph" role="img" aria-label="Foto de {{i.titulo}}" style="height: 168px; flex-direction: column; gap: 4px; border-radius: 0">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg>
          <span class="mono xs">Foto</span>
        </span>
        <span style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; gap: 6px; flex-wrap: wrap"><span class="badge">{{i.operacion}}</span><span class="badge {{i.estadoCls}}">{{i.estado}}</span></span>
          <span style="font-weight: 650; font-size: 17px">{{i.titulo}}</span>
          <span class="small mut">{{i.zona}}</span>
          <span class="mono xs mut">{{i.medidas}}</span>
          <span class="mono" style="font-weight: 600; color: var(--ptext)">{{i.precio}}</span>
        </span>
      </a>
    </sc-for>
  </main>
  <dc-import name="BarraInferior" activo="menu" hint-size="390px,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      inmuebles: [
        { titulo: 'Casa en Playas de Tijuana', zona: 'Playas de Tijuana', medidas: '180 m² const. · 3 rec. · 2.5 baños', precio: '$4,850,000 MXN', operacion: 'Venta', estado: 'En preparación', estadoCls: '' },
        { titulo: 'Casa en Baja Malibú', zona: 'Rosarito', medidas: '310 m² const. · 4 rec. · 3 baños', precio: '$6,900,000 MXN', operacion: 'Venta', estado: 'Con oferta', estadoCls: 'badge-pri' },
        { titulo: 'Casa en Otay Universidad', zona: 'Tijuana', medidas: '140 m² const. · 3 rec. · 2 baños', precio: '$2,650,000 MXN', operacion: 'Venta', estado: 'Publicado', estadoCls: '' },
        { titulo: 'Departamento amueblado', zona: 'Rosarito centro', medidas: '78 m² · 1 rec. · 1 baño', precio: '$16,500 MXN / mes', operacion: 'Renta', estado: 'Publicado', estadoCls: '' }
      ]
    };
  }
}
</script>
</body>
</html>
