<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agenda</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fortius-panel.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fp" style="width: 100%; min-height: 1000px; display: flex; flex-wrap: wrap; align-items: stretch">
  <div style="flex: 0 0 248px; display: flex">
    <dc-import name="Sidebar" activo="agenda" hint-size="248px,1000px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; max-width: 1192px; padding: 40px 48px 48px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 class="h1">Agenda</h1>
        <p class="mut">Semana del <span class="mono">12</span> al <span class="mono">18 oct 2026</span> · 5 visitas</p>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <button class="icon-btn borde" type="button" aria-label="Semana anterior"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <button class="btn btn-sec" type="button">Hoy</button>
        <button class="icon-btn borde" type="button" aria-label="Semana siguiente"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        <button class="btn btn-sec" type="button" style="margin-left: 8px">
          <svg class="ico ico-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Agendar
        </button>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Vista">
      <button class="tab on" role="tab" aria-selected="true" type="button">Agenda</button>
      <button class="tab" role="tab" aria-selected="false" type="button">Tareas <span class="mono xs">9</span></button>
    </div>

    <div style="display: flex; gap: 16px; align-items: center" class="small">
      <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; background: var(--pri); border-radius: 2px"></span>Visita</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; background: var(--card); border: 1px solid var(--edge); border-radius: 2px"></span>Cita o llamada</span>
    </div>

    <div class="card" style="overflow-x: auto">
      <div style="min-width: 860px">
        <div style="display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line)">
          <span></span>
          <sc-for list="{{dias}}" as="d" hint-placeholder-count="7">
            <span aria-current="{{d.cur}}" style="padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); background: {{d.fondo}}">
              <span class="xs mut" style="font-weight: 600; text-transform: uppercase; letter-spacing: .06em">{{d.nombre}}</span>
              <span class="mono" style="font-size: 18px; font-weight: {{d.peso}}">{{d.num}}</span>
            </span>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr))">
          <div style="display: flex; flex-direction: column">
            <sc-for list="{{horas}}" as="h" hint-placeholder-count="11">
              <span class="mono xs mut" style="height: 56px; padding: 4px 10px 0 0; text-align: right">{{h}}</span>
            </sc-for>
          </div>
          <sc-for list="{{dias}}" as="d" hint-placeholder-count="7">
            <div style="position: relative; height: 616px; border-left: 1px solid var(--line); background: {{d.fondo}}; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 55px, var(--line) 55px, var(--line) 56px)">
              <sc-for list="{{d.eventos}}" as="e" hint-placeholder-count="1">
                <a href="#" style="position: absolute; left: 4px; right: 4px; top: {{e.top}}px; height: {{e.alto}}px; padding: 6px 8px; border-radius: 8px; overflow: hidden; text-decoration: none; display: flex; flex-direction: column; gap: 2px; background: {{e.fondo}}; color: {{e.tinta}}; border: 1px solid {{e.borde}}">
                  <span class="mono xs" style="font-weight: 600">{{e.hora}}</span>
                  <span class="xs" style="font-weight: 650; line-height: 1.25">{{e.titulo}}</span>
                </a>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 56, INI = 8;
    const ev = (hora, dur, titulo, visita) => {
      const [h, m] = hora.split(':').map(Number);
      return {
        hora, titulo,
        top: (h - INI + m / 60) * H + 2,
        alto: dur * H - 4,
        fondo: visita ? 'var(--pri)' : 'var(--card)',
        tinta: visita ? '#ffffff' : 'var(--fg)',
        borde: visita ? 'var(--pedge)' : 'var(--edge)'
      };
    };
    const dias = [
      { nombre: 'Lun', num: 12, eventos: [ev('10:00', 1, 'Fotos · Depto Chapultepec', false), ev('16:00', 1, 'Visita · Casa Otay Universidad', true)] },
      { nombre: 'Mar', num: 13, eventos: [ev('09:30', 1, 'Firma de contrato · Navarro Lugo', false)] },
      { nombre: 'Mié', num: 14, eventos: [ev('12:00', 1.5, 'Visita · Local en Tecate', true)] },
      { nombre: 'Jue', num: 15, eventos: [ev('11:00', 1, 'Llamada · Sofía Arreola', false), ev('17:30', 1, 'Visita · Depto Rosarito centro', true)] },
      { nombre: 'Vie', num: 16, hoy: true, eventos: [ev('11:00', 1, 'Visita · Casa Baja Malibú', true), ev('13:30', 1.5, 'Entrevista · Lucía Mendoza', false), ev('17:00', 1, 'Visita · Depto Zona Río', true)] },
      { nombre: 'Sáb', num: 17, eventos: [ev('10:00', 1, 'Visita · Depto Rosarito centro', true)] },
      { nombre: 'Dom', num: 18, eventos: [] }
    ];
    return {
      horas: ['08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00'],
      dias: dias.map((d) => ({ ...d, cur: d.hoy ? 'date' : 'false', fondo: d.hoy ? 'var(--sel)' : 'transparent', peso: d.hoy ? '700' : '500' }))
    };
  }
}
</script>
</body>
</html>
