<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva operación en celular</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fortius-panel.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; min-height: 900px">
  <dc-import name="NuevaEscritorio" paso="{{paso}}" movil="{{true}}" hint-size="390px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paso":{"editor":"enum","options":[1,2,3,4],"default":1},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { paso: this.props.paso ?? 1 }; }
}
</script>
</body>
</html>
