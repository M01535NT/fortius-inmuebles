<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra lateral</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fortius-panel.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fp {{temaClase}}" style="width: 248px; min-height: 900px; height: 100%; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px 16px; background: var(--card); border-right: 1px solid var(--line)">
  <a href="Main.dc.html" aria-label="Fortius Inmuebles, ir a Hoy" style="display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; text-decoration: none">
    <span style="font-size: 27px; line-height: 1; font-weight: 700; font-variation-settings: 'wdth' 68; text-transform: uppercase; letter-spacing: 0.02em">Fortius</span>
    <span class="eyebrow" style="font-size: 11px">Inmuebles</span>
  </a>

  <a class="btn btn-pri btn-lg" href="NuevaEscritorio.dc.html" style="width: 100%">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Nueva operación
  </a>

  <nav aria-label="Secciones" style="display: flex; flex-direction: column; gap: 2px">
    <a class="navlink {{on.hoy}}" href="Main.dc.html" aria-current="{{cur.hoy}}">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      Hoy
      <span class="count" style="margin-left: auto" aria-label="7 pendientes">7</span>
    </a>
    <a class="navlink {{on.operaciones}}" href="OperacionesEscritorio.dc.html" aria-current="{{cur.operaciones}}">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"></rect><rect x="10" y="4" width="5" height="11" rx="1"></rect><rect x="17" y="4" width="4" height="7" rx="1"></rect></svg>
      Operaciones
    </a>
    <a class="navlink {{on.contactos}}" href="ContactosEscritorio.dc.html" aria-current="{{cur.contactos}}">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.8c1.9.7 3.1 2.5 3.5 5.2"></path></svg>
      Contactos
    </a>
    <a class="navlink {{on.inmuebles}}" href="InmueblesEscritorio.dc.html" aria-current="{{cur.inmuebles}}">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"></rect><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"></path></svg>
      Inmuebles
    </a>
    <a class="navlink {{on.agenda}}" href="AgendaEscritorio.dc.html" aria-current="{{cur.agenda}}">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      Agenda
    </a>
  </nav>

  <div class="hr"></div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <a class="navlink sub" href="#">
      <svg class="ico ico-s" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"></rect></svg>
      Herramientas
      <span class="mono xs mut" style="margin-left: auto">16</span>
    </a>
  </div>

  <sc-if value="{{admin}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <button class="navlink sub" type="button" aria-expanded="{{abiertaTxt}}">
        <svg class="ico ico-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg>
        Administración
        <sc-if value="{{adminAbierta}}" hint-placeholder-val="{{false}}">
          <svg class="ico ico-s" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: auto"><path d="M6 15l6-6 6 6"></path></svg>
        </sc-if>
        <sc-if value="{{adminCerrada}}" hint-placeholder-val="{{true}}">
          <svg class="ico ico-s" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: auto"><path d="M6 9l6 6 6-6"></path></svg>
        </sc-if>
      </button>
      <sc-if value="{{adminAbierta}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 28px">
          <a class="navlink sub" href="#">Equipo</a>
          <a class="navlink sub" href="#">Sitio web</a>
          <a class="navlink sub" href="#">Reportes</a>
          <a class="navlink sub" href="#">Historial</a>
          <a class="navlink sub" href="#">Configuración</a>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 8px 0; border-top: 1px solid var(--line)">
    <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 8px; background: var(--sec); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">{{iniciales}}</span>
    <span style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-weight: 600; font-size: 14px; line-height: 1.3">{{usuario}}</span>
      <span class="xs mut">{{rol}}</span>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activo":{"editor":"enum","options":["hoy","operaciones","contactos","inmuebles","agenda"],"default":"hoy"},"admin":{"editor":"boolean","default":false},"adminAbierta":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const activo = this.props.activo ?? 'hoy';
    const keys = ['hoy', 'operaciones', 'contactos', 'inmuebles', 'agenda'];
    const on = {}, cur = {};
    keys.forEach((k) => { on[k] = k === activo ? 'on' : ''; cur[k] = k === activo ? 'page' : 'false'; });
    const admin = !!this.props.admin;
    const abierta = admin && !!this.props.adminAbierta;
    return {
      on, cur, admin,
      adminAbierta: abierta,
      adminCerrada: !abierta,
      abiertaTxt: abierta ? 'true' : 'false',
      temaClase: this.props.tema === 'oscuro' ? 'oscuro' : '',
      usuario: admin ? 'Jorge Salcedo' : 'Mariana Ruiz',
      rol: admin ? 'Administrador' : 'Asesora',
      iniciales: admin ? 'JS' : 'MR'
    };
  }
}
</script>
</body>
</html>
