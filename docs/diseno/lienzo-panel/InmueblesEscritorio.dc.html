<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inmuebles</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fortius-panel.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fp" style="width: 100%; min-height: 1100px; display: flex; flex-wrap: wrap; align-items: stretch">
  <div style="flex: 0 0 248px; display: flex">
    <dc-import name="Sidebar" activo="inmuebles" hint-size="248px,1100px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; max-width: 1192px; padding: 40px 48px 56px; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 class="h1">Inmuebles</h1>
        <p class="mut">18 inmuebles · 12 publicados</p>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
        <div class="seg" role="radiogroup" aria-label="Operación">
          <button type="button" role="radio" aria-checked="true" class="on">Todos</button>
          <button type="button" role="radio" aria-checked="false">En venta</button>
          <button type="button" role="radio" aria-checked="false">En renta</button>
        </div>
        <label style="display: flex; align-items: center; gap: 10px; width: 260px; min-height: 44px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 6px; background: var(--field)">
          <svg class="ico ico-s mut" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span class="mut" style="font-size: 15px">Buscar colonia o calle</span>
        </label>
      </div>
    </header>

    <ul class="card lista">
      <sc-for list="{{inmuebles}}" as="i" hint-placeholder-count="6">
        <li>
          <a href="#" style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 16px 20px; text-decoration: none">
            <span class="ph" role="img" aria-label="Foto de {{i.titulo}}" style="width: 160px; height: 110px; flex: none; flex-direction: column; gap: 4px">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg>
              <span class="mono xs">Foto</span>
            </span>
            <span style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="display: flex; gap: 6px; flex-wrap: wrap">
                <span class="badge">{{i.operacion}}</span>
                <span class="badge {{i.estadoCls}}">{{i.estado}}</span>
              </span>
              <span style="font-weight: 650; font-size: 17px">{{i.titulo}}</span>
              <span class="small mut" style="display: flex; align-items: center; gap: 4px">
                <svg class="ico ico-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
                {{i.zona}}
              </span>
              <span class="mono xs mut">{{i.medidas}}</span>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 180px">
              <span class="mono" style="font-weight: 600; font-size: 17px; color: var(--ptext)">{{i.precio}}</span>
              <span class="mono xs mut">{{i.folio}}</span>
            </span>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      inmuebles: [
        { titulo: 'Casa en Playas de Tijuana', zona: 'Av. del Pacífico, Playas de Tijuana', medidas: '180 m² const. · 220 m² terreno · 3 rec. · 2.5 baños', precio: '$4,850,000 MXN', operacion: 'Venta', estado: 'En preparación', estadoCls: '', folio: 'EXP-2026-041' },
        { titulo: 'Departamento en Chapultepec', zona: 'Calle Loma Bonita, Chapultepec', medidas: '96 m² · 2 rec. · 2 baños · piso 5', precio: '$3,200,000 MXN', operacion: 'Venta', estado: 'Detenido', estadoCls: '', folio: 'EXP-2026-038' },
        { titulo: 'Casa en Baja Malibú', zona: 'Baja Malibú, Rosarito', medidas: '310 m² const. · 450 m² terreno · 4 rec. · 3 baños', precio: '$6,900,000 MXN', operacion: 'Venta', estado: 'Con oferta', estadoCls: 'badge-pri', folio: 'EXP-2026-031' },
        { titulo: 'Casa en Otay Universidad', zona: 'Otay Universidad, Tijuana', medidas: '140 m² const. · 160 m² terreno · 3 rec. · 2 baños', precio: '$2,650,000 MXN', operacion: 'Venta', estado: 'Publicado', estadoCls: '', folio: 'EXP-2026-035' },
        { titulo: 'Departamento en Zona Río', zona: 'Paseo de los Héroes, Zona Río', medidas: '120 m² · 2 rec. · 2 baños · estacionamiento', precio: '$3,980,000 MXN', operacion: 'Venta', estado: 'En cierre', estadoCls: 'badge-pri', folio: 'EXP-2026-027' },

        { titulo: 'Local en el centro de Tecate', zona: 'Av. Juárez, Tecate', medidas: '85 m² · 1 baño · frente de 6 m', precio: '$1,450,000 MXN', operacion: 'Venta', estado: 'Publicado', estadoCls: '', folio: 'EXP-2026-033' }
      ]
    };
  }
}
</script>
</body>
</html>
