<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra inferior</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fortius-panel.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav class="fp {{temaClase}}" aria-label="Principal" style="width: 390px; height: 80px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 6px 8px 14px; background: var(--card); border-top: 1px solid var(--line)">
  <a href="HoyMovil.dc.html" aria-current="{{cur.hoy}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; font-size: 12px; font-weight: {{peso.hoy}}; color: {{color.hoy}}">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
    Hoy
    <span class="count" aria-label="7 pendientes" style="position: absolute; top: 2px; left: calc(50% + 6px); min-width: 20px; height: 18px; font-size: 11px; padding: 0 5px">7</span>
    <sc-if value="{{es.hoy}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; bottom: -2px; width: 24px; height: 3px; background: var(--pri)"></span></sc-if>
  </a>
  <a href="OperacionesMovil.dc.html" aria-current="{{cur.operaciones}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; font-size: 12px; font-weight: {{peso.operaciones}}; color: {{color.operaciones}}">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"></rect><rect x="10" y="4" width="5" height="11" rx="1"></rect><rect x="17" y="4" width="4" height="7" rx="1"></rect></svg>
    Operaciones
    <sc-if value="{{es.operaciones}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; bottom: -2px; width: 24px; height: 3px; background: var(--pri)"></span></sc-if>
  </a>
  <span style="display: flex; justify-content: center">
    <a href="NuevaMovil.dc.html" aria-label="Nueva operación" style="width: 56px; height: 56px; border-radius: 4px; background: var(--pri); border: 1px solid var(--pedge); color: #fff; display: inline-flex; align-items: center; justify-content: center">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </span>
  <a href="ContactosMovil.dc.html" aria-current="{{cur.contactos}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; font-size: 12px; font-weight: {{peso.contactos}}; color: {{color.contactos}}">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.8c1.9.7 3.1 2.5 3.5 5.2"></path></svg>
    Contactos
    <sc-if value="{{es.contactos}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; bottom: -2px; width: 24px; height: 3px; background: var(--pri)"></span></sc-if>
  </a>
  <a href="MenuMovil.dc.html" aria-current="{{cur.menu}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; font-size: 12px; font-weight: {{peso.menu}}; color: {{color.menu}}">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    Menú
    <sc-if value="{{es.menu}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; bottom: -2px; width: 24px; height: 3px; background: var(--pri)"></span></sc-if>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activo":{"editor":"enum","options":["hoy","operaciones","contactos","menu"],"default":"hoy"},"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro"},"$preview":{"width":390,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const activo = this.props.activo ?? 'hoy';
    const es = {}, cur = {}, peso = {}, color = {};
    ['hoy', 'operaciones', 'contactos', 'menu'].forEach((k) => {
      const a = k === activo;
      es[k] = a; cur[k] = a ? 'page' : 'false';
      peso[k] = a ? '700' : '500';
      color[k] = a ? 'var(--fg)' : 'var(--mut)';
    });
    return { es, cur, peso, color, temaClase: this.props.tema === 'oscuro' ? 'oscuro' : '' };
  }
}
</script>
</body>
</html>
