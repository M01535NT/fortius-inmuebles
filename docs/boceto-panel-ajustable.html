/* Tras redibujar, el foco vuelve al mismo control: por su id o por sus atributos data-. */
const ATR = ["a", "c", "l", "k", "i", "d", "j", "r", "id", "q", "o", "n"];
function clave(el) {
  if (!el || !el.tagName || el === document.body) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  let s = el.tagName.toLowerCase(), hay = false;
  for (const k of ATR) if (el.dataset[k] !== undefined) { s += `[data-${k}="${CSS.escape(el.dataset[k])}"]`; hay = true; }
  return hay ? s : null;
}
function repinta(el, antes = S.ruta) {
  const enMenu = !!(el && el.closest && el.closest("#menu"));
  let k = S.foco || clave(el); S.foco = null;
  pinta();
  const cambio = S.ruta !== antes; if (cambio && !enMenu) k = null;
  let n = null; try { n = k && document.querySelector(k); } catch (_) { n = null; }
  (n || $("#vista h1")).focus({ preventScroll: true });
  /* El foco no mueve la vista: al cambiar de pantalla se empieza arriba; si no, solo se acerca lo justo. */
  if (cambio) $("#vista").scrollTop = 0;
  else if (n) n.scrollIntoView({ block: "nearest", inline: "nearest" });
  if (n && n.closest(".tira")) n.scrollIntoView({ block: "nearest", inline: "nearest" });
}
