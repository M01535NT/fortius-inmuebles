<title>Fortius por asuntos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<style>
/* Disposición: app de trabajo. Menú lateral con íconos, lista de asuntos, el asunto abierto y una ventana lateral para cada parte.
   Cada grupo de opciones vive en un solo botón que abre su lista; en pantalla quedan pocas palabras y muchos íconos. */
:root{
  --bg:#F5F6F8; --side:#ECEEF2; --card:#FFFFFF; --bd:#E2E5EA; --tx:#0F1218; --tx2:#596070; --tx3:#939AA8; --hov:rgba(15,18,24,.055);
  --acc:#2F6BFF; --acc-f:#E8EFFF; --on-acc:#FFFFFF; --on-tile:#FFFFFF; --papel:#FFFFFF; --tinta-papel:#16181D;
  --ok:#0E9F4F; --ok-f:#E3F6EA; --warn:#B56A00; --warn-f:#FFF0D6; --bad:#D8362A; --bad-f:#FDEAE8;
  --c-blue:#2F6BFF; --c-orange:#F27A0E; --c-red:#E5484D; --c-teal:#0C9CA8; --c-violet:#7B5CFA; --c-green:#12A150; --c-indigo:#4A55E6; --c-gray:#7B8392;
  --sombra:0 14px 38px rgba(15,18,24,.16),0 2px 6px rgba(15,18,24,.06);
  --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F12; --side:#131418; --card:#191A1F; --bd:#292B33; --tx:#EDEEF1; --tx2:#A2A8B4; --tx3:#6D7381; --hov:rgba(255,255,255,.065);
  --acc:#5C8CFF; --acc-f:#18233F; --on-acc:#FFFFFF; --on-tile:#FFFFFF;
  --ok:#3DD68C; --ok-f:#11281D; --warn:#F5B94A; --warn-f:#2E2208; --bad:#FF7B72; --bad-f:#33161A;
  --c-blue:#3D74FF; --c-orange:#F27A0E; --c-red:#E5484D; --c-teal:#0C9CA8; --c-violet:#7B5CFA; --c-green:#12A150; --c-indigo:#5560F0; --c-gray:#6B7382;
  --sombra:0 14px 38px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F12; --side:#131418; --card:#191A1F; --bd:#292B33; --tx:#EDEEF1; --tx2:#A2A8B4; --tx3:#6D7381; --hov:rgba(255,255,255,.065);
  --acc:#5C8CFF; --acc-f:#18233F; --on-acc:#FFFFFF; --on-tile:#FFFFFF;
  --ok:#3DD68C; --ok-f:#11281D; --warn:#F5B94A; --warn-f:#2E2208; --bad:#FF7B72; --bad-f:#33161A;
  --c-blue:#3D74FF; --c-orange:#F27A0E; --c-red:#E5484D; --c-teal:#0C9CA8; --c-violet:#7B5CFA; --c-green:#12A150; --c-indigo:#5560F0; --c-gray:#6B7382;
  --sombra:0 14px 38px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
h1,h2,h3,p,hr{margin:0}
svg{flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:8px}
#app{height:100%}
.app{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}

/* Menú lateral */
.side{background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;padding:14px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));min-height:0;overflow-y:auto}
.ws{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.logo{width:26px;height:26px;border-radius:8px;background:var(--tx);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:14px}
.srch{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;background:var(--card);border:1px solid var(--bd);color:var(--tx3);margin:8px 0 6px}
.srch input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%}
.nv{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:8px;font-weight:500;color:var(--tx2);width:100%}
.nv:hover{background:var(--hov)}
.nv[aria-current="page"]{background:var(--card);color:var(--tx);box-shadow:0 0 0 1px var(--bd)}
.nv .n{margin-left:auto;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.sec{font-size:12px;color:var(--tx3);font-weight:550;padding:14px 8px 4px}
.barra{display:none}

/* Zonas */
.main{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.main.dos{grid-template-columns:340px minmax(0,1fr)}
.pane{overflow-y:auto;min-height:0;min-width:0;overscroll-behavior:contain}
.lista{border-right:1px solid var(--bd)}
.in{max-width:760px;margin:0 auto;padding-block:22px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.in.lado{padding-block:16px 60px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;gap:10px}
.in.ancho{max-width:1040px}

/* Texto */
.h1{font-size:24px;font-weight:680;letter-spacing:-.022em;line-height:1.15;text-wrap:balance}
.h2{font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.m{color:var(--tx2);font-size:13px}
.t3{color:var(--tx3)}
.num{font-variant-numeric:tabular-nums}
.sp{flex:1}
.fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nw{flex-wrap:nowrap}

/* Controles */
.btn{height:34px;padding:0 12px;border-radius:9px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;border:1px solid var(--bd);background:var(--card);transition:transform .1s,background .1s}
.btn:hover{background:var(--hov)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.gho{border-color:transparent;background:none}
.btn.gho:hover{background:var(--hov)}
.btn.ico{width:34px;padding:0}
.btn.w{width:100%}
.dd{height:34px;padding:0 9px 0 11px;border-radius:9px;border:1px solid var(--bd);background:var(--card);display:inline-flex;align-items:center;gap:7px;max-width:100%;font-weight:500}
.dd:hover{background:var(--hov)}
.dd>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd>svg:last-child{color:var(--tx3)}
.dd.vac>span{color:var(--tx3);font-weight:400}
.dd.w{width:100%;justify-content:space-between}
.dd.w>span{flex:1}
.dd.pil{border-radius:999px;height:30px}
.inp{width:100%;height:34px;border:1px solid var(--bd);border-radius:9px;background:var(--card);padding:0 11px;outline:none}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-f)}
.inp::placeholder{color:var(--tx3)}
textarea.inp{height:auto;min-height:92px;padding:9px 11px;resize:vertical;line-height:1.5}
.uni{position:relative}
.uni .inp{padding-right:46px}
.uni i{position:absolute;right:10px;top:8px;font-style:normal;font-size:12px;color:var(--tx3)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--tx2);font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seg{display:inline-flex;align-self:flex-start;background:var(--hov);border-radius:9px;padding:2px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-weight:500;color:var(--tx2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--bd)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--hov);color:var(--tx2);white-space:nowrap}
.pill.ok{background:var(--ok-f);color:var(--ok)} .pill.warn{background:var(--warn-f);color:var(--warn)} .pill.bad{background:var(--bad-f);color:var(--bad)} .pill.acc{background:var(--acc-f);color:var(--acc)}
.c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-ok{color:var(--ok)} .c-acc{color:var(--acc)}
.tile{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--on-tile);flex:none}
.tile.ch{width:22px;height:22px;border-radius:6px}
.sw{width:40px;height:24px;border-radius:999px;background:var(--bd);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--on-tile);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .16s}
.sw[aria-checked="true"]{background:var(--ok)} .sw[aria-checked="true"]::after{transform:translateX(16px)}

/* Tarjetas y renglones */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px}
.card:not(.pad)>*+*{border-top:1px solid var(--bd)}
.pad{padding:14px}
.ren{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:9px 12px}
button.ren:hover{background:var(--hov)}
.card>button.ren:first-child{border-radius:13px 13px 0 0} .card>button.ren:last-child{border-radius:0 0 13px 13px}
.ren .c{flex:1;min-width:0;display:flex;flex-direction:column}
.ren .c b{font-weight:600}
.ren .c span{color:var(--tx2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ren>svg:last-child{color:var(--tx3)}
.it{display:flex;gap:10px;width:100%;padding:10px;border-radius:10px;align-items:flex-start}
.it:hover{background:var(--hov)}
.it[aria-current="true"]{background:var(--card);box-shadow:0 0 0 1px var(--bd)}
.it .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.it b{font-weight:600;overflow-wrap:anywhere}
.it .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Asunto */
.top{display:flex;align-items:center;gap:8px;min-height:34px}
.atras{display:none}
.sigue{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 6px;border-radius:14px;background:var(--acc-f);border:1px solid transparent}
.sigue .q{font-size:15px;font-weight:650;letter-spacing:-.01em;overflow-wrap:anywhere}

/* Tareas */
.t{display:flex;align-items:center;gap:2px;min-height:44px}
.ckb{width:36px;height:40px;display:grid;place-items:center;flex:none}
.ck{width:19px;height:19px;border-radius:50%;border:1.6px solid var(--tx3);display:grid;place-items:center}
.ck.cu{border-radius:6px}
.t[data-est="hecha"] .ck{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.t[data-est="na"] .ck{border-style:dashed}
.t[data-est="bloq"] .ck{border-color:var(--warn);background:var(--warn-f)}
.tb{flex:1;min-width:0;padding:6px 0;display:flex;flex-direction:column}
.tb .n{font-weight:500;overflow-wrap:anywhere}
.t[data-est="hecha"] .tb .n,.t[data-est="na"] .tb .n{color:var(--tx3);text-decoration:line-through}
.edit{margin:2px 0 10px 36px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.et{padding:6px 12px 10px}
.et-h{display:flex;align-items:center;gap:8px;padding:8px 0 2px;font-weight:600}
.sumar{display:flex;gap:8px;align-items:center;padding-top:6px}

/* Línea de tiempo */
.eje{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3)}
.ge{display:grid;gap:5px;padding:6px 0}
.gb{position:relative;height:18px;border-radius:9px;background:var(--hov)}
.gb i{position:absolute;display:block}
.gbar{top:7px;height:4px;border-radius:2px;background:var(--acc);opacity:.45}
.gd{top:3px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc);transform:translateX(-50%)}
.gd.h{background:var(--acc)}
.gnow{top:-3px;bottom:-3px;width:2px;background:var(--bad);border-radius:1px;transform:translateX(-50%)}

/* Ventana lateral */
.wvelo{position:fixed;inset:0;background:rgba(10,12,16,.32);z-index:20;animation:funde .15s}
.win{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);border-left:1px solid var(--bd);box-shadow:var(--sombra);z-index:21;display:flex;flex-direction:column;animation:desliza .24s cubic-bezier(.2,.8,.2,1)}
.win-h{display:flex;align-items:center;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
.win-h b{font-size:15px;font-weight:650}
.win-c{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 60px 16px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.win-c>*{flex-shrink:0}
.win-c>.btn{align-self:flex-start}
.quieta,.quieta.pop{animation:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:-4px 0 0;overflow-x:auto}
.tabs button{height:38px;padding:0 10px;display:inline-flex;align-items:center;gap:7px;font-weight:550;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--tx);border-color:var(--acc)}
.gh{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;font-weight:600}
.gh svg:first-child{color:var(--tx3);transition:transform .16s}
.gh[aria-expanded="true"] svg:first-child{transform:rotate(90deg)}
.fotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.foto{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--hov);border:1px solid var(--bd)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .pill{position:absolute;left:6px;top:6px;background:var(--card);color:var(--tx)}
.foto .btn{position:absolute;right:6px;top:6px;height:26px;width:26px}
.vacio{border:1.5px dashed var(--bd);border-radius:14px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--tx2)}
.arch{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;color:var(--acc);background:var(--acc-f);padding:3px 8px;border-radius:7px;max-width:100%}
.arch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc-f);color:var(--acc);display:grid;place-items:center;font-weight:650;font-size:11.5px;flex:none}
.total{display:flex;justify-content:space-between;font-weight:650;padding:12px}
.mini{width:44px;height:34px;border-radius:8px;object-fit:cover;flex:none;background:var(--hov)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;background:var(--bg);min-width:0}
.stat b{font-size:18px;font-weight:680;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--tx2)}
.ren.sola{border:1.5px dashed var(--bd);border-radius:14px;color:var(--tx2);font-weight:550;justify-content:center;min-height:46px}
.cuenta{margin-top:auto;height:auto;padding:8px}
.cuenta .c{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.cuenta .c small{color:var(--tx3);font-size:12px}
.chipas{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:12.5px;font-weight:550;max-width:230px}
.chipas:hover{background:var(--hov)}
.chipas span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ban{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--acc-f);font-weight:550}
.ban.esp{background:var(--warn-f)}
.tbl{width:100%;border-collapse:collapse;min-width:420px}
.tbl th{font-size:12px;color:var(--tx2);font-weight:600;text-align:left;padding:10px 8px 6px}
.tbl td{padding:4px 4px;min-width:110px}.tbl td:first-child{min-width:190px}.tbl td:last-child{min-width:0;width:40px}
.tbl .inp{border-color:transparent;background:var(--bg)}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fotoc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;aspect-ratio:4/3;background:var(--hov);border-radius:13px 13px 0 0;overflow:hidden;color:var(--tx3)}
.fotoc img{width:100%;height:100%;object-fit:cover}
.fmt{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.fmt-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
.fmt-q{padding:22px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;border-right:1px solid var(--bd)}
.fmt-p{overflow-y:auto;padding:24px 20px}
.papel{max-width:640px;margin:0 auto;background:var(--papel);color:var(--tinta-papel);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.14);padding:44px 48px;font-size:14px;line-height:1.9}
.papel h3{font-size:15px;text-align:center;margin:0 0 18px;letter-spacing:.02em}
.hueco{display:inline;border-bottom:1.5px solid var(--tinta-papel);padding:0 4px;font-weight:650;cursor:pointer;border-radius:3px 3px 0 0}
.hueco.vac{color:transparent;user-select:none}
.hueco.act{background:var(--acc-f);border-bottom-color:var(--acc);color:var(--tinta-papel)}
.hueco.vac.act{color:transparent}
.barra-prog{height:6px;border-radius:3px;background:var(--hov);overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--acc)}
@media (max-width:900px){.fmt{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}.fmt-q{border-right:0;border-bottom:1px solid var(--bd);padding:16px}.papel{padding:26px 22px}.gal{grid-template-columns:minmax(0,1fr)}#p-det .top,.in.ancho .top{flex-wrap:wrap;row-gap:10px}#p-det .top>.dd,#p-det .top>.btn.pri{order:2}#p-det .top>.btn.pri{margin-left:auto}}
.hi{display:flex;gap:10px;padding:10px 12px}

/* Menú desplegable */
.mvelo{position:fixed;inset:0;z-index:40}
.pop{position:fixed;z-index:41;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sombra);padding:5px;overflow-y:auto;animation:brota .14s cubic-bezier(.2,.8,.2,1)}
.mi{display:flex;align-items:center;gap:9px;width:100%;min-height:34px;padding:6px 9px;border-radius:8px;font-weight:500}
.mi:hover{background:var(--hov)}
.mi span{flex:1;min-width:0}
.mi>svg:first-child{color:var(--tx2)}
.mi>svg:last-child:not(:first-child){color:var(--acc)}
.mi.pel,.mi.pel>svg:first-child{color:var(--bad)}
.pop hr{border:0;border-top:1px solid var(--bd);margin:5px 0}
.mt{font-size:12px;color:var(--tx3);padding:6px 9px 3px;font-weight:550}

/* Diálogo y aviso */
.velo{position:fixed;inset:0;background:rgba(10,12,16,.4);display:grid;place-items:center;z-index:50;padding:16px;animation:funde .15s}
.hoja{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sombra);width:min(480px,100%);max-height:84%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--tx);color:var(--card);border-radius:12px;padding:4px 6px 4px 14px;min-height:42px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);font-weight:500;box-shadow:var(--sombra)}
.aviso button{color:var(--card);font-weight:650;height:34px;padding:0 10px;border-radius:8px;text-decoration:underline;text-underline-offset:3px}
